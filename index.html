<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찍고 듣기 - Gemini 카메라 음성</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         background: #111; color: #eee; padding: 16px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  label { display: block; font-size: 13px; color: #aaa; margin: 10px 0 4px; }
  input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333;
                    background: #1c1c1c; color: #eee; font-size: 15px; }
  textarea { min-height: 60px; resize: vertical; }
  details { background: #1a1a1a; border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
  summary { cursor: pointer; font-weight: 600; }
  button { width: 100%; padding: 16px; font-size: 18px; font-weight: 700; border: 0;
           border-radius: 12px; margin-top: 10px; cursor: pointer; }
  .main { background: #4f8cff; color: #fff; }
  .sub  { background: #2a2a2a; color: #eee; font-size: 16px; padding: 12px; }
  .stop { background: #ff5a5a; color: #fff; }
  .row { display: flex; gap: 8px; } .row button { flex: 1; }
  #stage { position: relative; margin-top: 14px; border-radius: 12px; overflow: hidden;
           background: #000; aspect-ratio: 3/4; display: none; }
  #stage video, #stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           font-size: 96px; font-weight: 800; color: #fff; text-shadow: 0 0 20px #000; }
  #status { margin-top: 12px; font-size: 15px; color: #9ec1ff; min-height: 20px; }
  #answer { margin-top: 10px; background: #1a1a1a; border-radius: 10px; padding: 14px;
            line-height: 1.6; white-space: pre-wrap; display: none; }
  .hidden { display: none !important; }
  #shots { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; }
  .thumb { position: relative; flex: 0 0 auto; width: 96px; aspect-ratio: 3/4; border-radius: 10px;
           overflow: hidden; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb b { position: absolute; left: 6px; top: 4px; background: #000a; border-radius: 6px;
             padding: 1px 7px; font-size: 13px; }
  /* 처음 화면: 시작 버튼이 남은 화면을 가득 채움 */
  body.initial { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  body.initial details { flex: none; }
  body.initial #startBtn { flex: 1; min-height: 55vh; min-height: 55dvh; font-size: 36px; line-height: 1.4; }
  body.initial #testBtn { flex: none; }
</style>
</head>
<body class="initial">
<h1>📷 찍고 → 🤖 Gemini → 🔊 계속 듣기</h1>

<details id="settings">
  <summary>설정 (처음 한 번만)</summary>
  <label>Gemini API 키 (aistudio.google.com 에서 발급)</label>
  <input id="key" type="password" placeholder="AIza..." autocomplete="off">
  <label>모델 이름</label>
  <input id="model" value="gemini-3.6-flash">
  <label>서버가 바쁠 때 쓸 대체 모델 (비우면 사용 안 함)</label>
  <input id="fallback" value="gemini-2.5-flash">
  <label>Gemini에게 보낼 질문</label>
  <textarea id="prompt">지금부터 코딩 문제를 보여주면 다른 설명 아무것도 없이, 답만 출력해. 언어는 java이고, 답은 for (int test_case =1; test_case <= T; test_case++) {이 안에 들어갈 답만 출력해}.</textarea>
  <label>읽는 속도 (0.5 ~ 2)</label>
  <input id="rate" type="number" step="0.05" min="0.5" max="2" value="0.8">
  <label>반복 사이 쉬는 시간 (초)</label>
  <input id="gap" type="number" step="0.5" min="0" value="10">
  <label>한 줄 안에서 말마디 사이 쉬는 시간 (초)</label>
  <input id="chunkgap" type="number" step="0.5" min="0" value="0.5">
  <label>코드 한 줄 읽고 쉬는 시간 (초)</label>
  <input id="linegap" type="number" step="1" min="0" value="5">
  <label>찍기 전 카운트다운 (초)</label>
  <input id="countdown" type="number" min="0" max="10" value="5">
  <label style="color:#eee;font-size:15px"><input type="checkbox" id="earOn" checked style="width:auto;margin-right:6px">🎧 이어폰 탭으로 조작</label>
  <div style="font-size:13px;color:#aaa;line-height:1.5">재생/일시정지 → 읽기 멈춤·이어 듣기 / 이전 곡 → 처음부터 다시 듣기 / 다음 곡 → 새로 3장 찍기<br>
  (QCY 앱에서 1탭=재생/일시정지, 2탭=이전 곡, 3탭=다음 곡으로 맞추세요)</div>
  <label>카메라 줌 (배, 1 = 줌 없음)</label>
  <input id="zoom" type="number" step="0.1" min="1" max="5" value="1.5">
</details>

<button id="startBtn" class="main">📷<br>시작<br><span style="font-size:15px;font-weight:400">카메라 켜고 자동으로 찍기</span></button>
<button id="testBtn" class="sub">🔊 음성만 테스트 (사진·API 안 씀)</button>
<input id="fileInput" type="file" accept="image/*" capture="environment" class="hidden">

<div id="stage">
  <video id="video" playsinline muted></video>
  <img id="photo" alt="찍은 사진" class="hidden">
  <div id="count"></div>
</div>

<div id="shots" class="hidden"></div>
<div id="shotControls" class="hidden">
  <button id="nextBtn" class="main"></button>
</div>

<div id="status"></div>
<div id="answer"></div>

<div id="controls" class="hidden">
  <button id="stopBtn" class="stop">⏹ 음성 멈추기</button>
  <div class="row">
    <button id="playBtn" class="sub">▶ 다시 재생</button>
    <button id="againBtn" class="sub">📷 새로 찍기</button>
  </div>
</div>
<div id="earMsg" style="margin-top:10px;font-size:13px;color:#8fd19e"></div>

<script>
const $ = id => document.getElementById(id);
const fields = ["key", "model", "fallback", "prompt", "rate", "gap", "linegap", "chunkgap", "countdown", "zoom"];

// 설정 저장/불러오기 (이 폰 브라우저에만 저장됨)
fields.forEach(f => {
  try { const v = localStorage.getItem("gcv_" + f); if (v !== null) $(f).value = v; } catch (e) {}
  $(f).addEventListener("change", () => { try { localStorage.setItem("gcv_" + f, $(f).value); } catch (e) {} });
});
if (!$("key").value) $("settings").open = true;

let stream = null, looping = false, answerText = "", answerLines = null, wakeLock = null;
let retakeCount = 0, digitalZoom = 1;
let capturing = false, curLine = 0, pausedLine = 0; // 촬영~답 나오기 전에는 재생 조작을 무시, 멈춘 줄 기억
const PHOTO_COUNT = 3; // 항상 3장을 자동으로 찍어서 한 번에 보냄
let runId = 0;
let photos = [], sending = false;
const MULTI_RULE = n => `\n\n[여러 장] 사진 ${n}장은 모두 한 문제를 찍은 거야. 같은 부분을 겹쳐 찍었을 수도 있고, 위에서부터 순서대로 나눠 찍었을 수도 있어. 사진들을 합쳐서 하나의 문제로 읽고 풀어줘.`;
const MAX_AUTO_RETAKE = 3;
const MAX_BUSY_RETRY = 3; // 서버가 바쁠 때 자동 재시도 횟수
// 저장된 예전 프롬프트를 써도 같은 답이 두 번 읽히지 않도록 코드에서 한 번 더 못박음
const SPEAK_RULE = `

[출력 형식 - 위 지시와 충돌하면 이 규칙이 우선]
- 설명은 쓰지 말고 아래 두 부분만 출력해. 같은 코드를 두 번 쓰지 마.
1) 정답 코드: \`\`\`java 로 시작하는 코드 블록 하나. 코드 블록 안에는 코드만 쓰고 주석은 쓰지 마.
2) 코드 블록 바로 다음 줄에 "발음:"으로 시작하는 한 줄. 코드에 나오는 두 글자 이상의 모든 영어 단어(예약어·변수·메서드·클래스 이름)의 한국어 발음을 단어=발음 형식으로 쉼표로 이어 써.
   예: 발음: int=인트, String=스트링, line=라인, charAt=차앳, Math=매스, abs=앱스, test_case=테스트케이스`;
const RETAKE_RULE = "\n\n[재촬영 규칙] 흐리거나 잘리거나 어두운 사진이 있어도, 나머지 사진으로 문제 전체를 정확히 읽을 수 있으면 그대로 풀어. 문제의 어떤 부분이라도 어떤 사진으로도 정확히 읽을 수 없을 때만, 다른 말은 절대 하지 말고 정확히 RETAKE 라는 단어 하나만 출력해.";
const setStatus = t => $("status").textContent = t;
// 사진이 찍혔을 때 약한 진동 (안드로이드 Chrome 등. 아이폰 Safari는 웹 진동 미지원)
const buzz = () => { try { navigator.vibrate && navigator.vibrate(150); } catch (e) {} };
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- 1. 카메라 켜고 자동 촬영 ----------
async function startCamera(isRetake = false) {
  const my = ++runId;
  stopSpeaking();
  photos = []; renderPhotos();
  $("shotControls").classList.add("hidden");
  $("answer").style.display = "none";
  $("controls").classList.add("hidden");
  if (!$("key").value.trim()) { $("settings").open = true; setStatus("먼저 설정에서 API 키를 넣어주세요."); return; }

  document.body.classList.remove("initial"); // 시작하면 버튼을 일반 크기로
  capturing = true;
  ensureEarbud();
  // 음성 기능 잠금 해제 (폰은 버튼을 누른 순간에만 소리를 허락함)
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(" "));
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {}
  if (!isRetake) speakOnce("사진을 찍겠습니다."); // 재촬영 때는 "재촬영하겠습니다"를 이미 말했으므로 생략 (기다리지 않고 카메라와 동시에 진행)

  // 3장을 알아서 차례로 찍고, 다 찍으면 자동으로 전부 보냄
  for (let i = 0; i < PHOTO_COUNT; i++) {
    const r = await captureOne(i, my);
    if (r !== "ok") return; // 취소됐거나, 기본 카메라 앱으로 넘어간 경우
  }
  if (my !== runId) return;
  await sendToGemini();
}

async function captureOne(i, my) {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }, audio: false
    });
  } catch (e) {
    // 자동 카메라가 안 되면 폰 기본 카메라 앱으로 대신 찍기
    setStatus("자동 카메라를 쓸 수 없어서 기본 카메라를 엽니다. 사진을 찍어주세요.");
    if (i === 0) { $("fileInput").value = ""; $("fileInput").click(); } else showNext();
    return "fallback";
  }
  if (my !== runId) { stopCamera(); return "cancel"; }

  $("stage").style.display = "block";
  $("photo").classList.add("hidden");
  const v = $("video");
  v.classList.remove("hidden");
  v.srcObject = stream;
  await v.play();
  await applyZoom();
  await sleep(700); // 초점·밝기 맞출 시간

  const label = `📷 ${i + 1}/${PHOTO_COUNT}번째 사진` + (i > 0 ? " — 문제의 다음 부분으로 옮겨주세요." : "");
  for (let k = Number($("countdown").value) || 0; k > 0; k--) {
    if (my !== runId) { stopCamera(); return "cancel"; }
    $("count").textContent = k; setStatus(label + " 곧 찍어요...");
    await sleep(1000);
  }
  $("count").textContent = "";
  if (my !== runId) { stopCamera(); return "cancel"; }

  // 디지털 줌이 필요하면 가운데 부분만 잘라서 사용
  const sw = v.videoWidth / digitalZoom, sh = v.videoHeight / digitalZoom;
  const sx = (v.videoWidth - sw) / 2, sy = (v.videoHeight - sh) / 2;
  const c = document.createElement("canvas");
  const scale = Math.min(1, 1280 / Math.max(sw, sh));
  c.width = sw * scale; c.height = sh * scale;
  c.getContext("2d").drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const dataUrl = c.toDataURL("image/jpeg", 0.85);
  stopCamera();
  addPhoto(dataUrl);
  return "ok";
}

// 줌: 카메라 자체 줌을 먼저 쓰고, 안 되면 디지털 줌(중앙 확대)으로 대신함
async function applyZoom() {
  const want = Math.max(1, Number($("zoom").value) || 1);
  digitalZoom = want;
  try {
    const track = stream.getVideoTracks()[0];
    const cap = track.getCapabilities && track.getCapabilities();
    if (cap && cap.zoom) {
      const target = Math.min(Math.max(want, cap.zoom.min), cap.zoom.max);
      await track.applyConstraints({ advanced: [{ zoom: target }] });
      digitalZoom = Math.max(1, want / target);
    }
  } catch (e) { digitalZoom = want; }
  $("video").style.transform = `scale(${digitalZoom})`;
}

function stopCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $("video").classList.add("hidden");
}

// ---------- 사진 모으기 (항상 PHOTO_COUNT장) ----------
function addPhoto(dataUrl) {
  photos.push(dataUrl);
  buzz(); // 사진이 찍힐 때마다 진동
  $("stage").style.display = "none";
  renderPhotos();
}
function renderPhotos() {
  const box = $("shots");
  box.textContent = "";
  photos.forEach((d, i) => {
    const t = document.createElement("div"); t.className = "thumb";
    const img = document.createElement("img"); img.src = d; img.alt = `사진 ${i + 1}`;
    const n = document.createElement("b"); n.textContent = i + 1;
    t.append(img, n); box.append(t);
  });
  box.classList.toggle("hidden", photos.length === 0);
}
// 기본 카메라 앱으로만 찍을 수 있는 폰: 다음 사진 버튼 (앱이 마음대로 카메라를 열 수 없어서)
function showNext() {
  $("shotControls").classList.remove("hidden");
  $("nextBtn").textContent = `📷 다음 사진 찍기 (${photos.length + 1}/${PHOTO_COUNT})`;
  setStatus(`📷 ${photos.length}/${PHOTO_COUNT}장 찍었어요. 문제의 다음 부분을 찍어주세요.`);
}

// 기본 카메라 앱으로 찍었을 때
$("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = async () => {
    const c = document.createElement("canvas");
    const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
    c.width = img.width * scale; c.height = img.height * scale;
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL("image/jpeg", 0.85);
    addPhoto(dataUrl);
    if (photos.length < PHOTO_COUNT) showNext(); else await sendToGemini();
  };
  img.src = URL.createObjectURL(file);
});

// ---------- 2. Gemini에 자동 전송 ----------
// 한 모델에 묻기. 서버가 바쁘면(503 등) 2초 → 4초 → 8초 뒤 같은 내용으로 재시도.
// 성공하면 응답 JSON, 새로 시작돼서 그만둘 땐 null, 실패하면 오류(status, busy, model 포함)를 던짐.
async function askModel(model, body, myRun, announce) {
  for (let attempt = 0; ; attempt++) {
    let res, json;
    try {
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": $("key").value.trim() },
        body
      });
      json = await res.json().catch(() => ({}));
    } catch (netErr) { res = { ok: false, status: 0 }; json = {}; } // 네트워크 끊김도 재시도
    if (res.ok) return json;
    const busy = [0, 500, 502, 503, 504].includes(res.status) || /high demand|overloaded|unavailable/i.test(json.error?.message || "");
    if (!busy || attempt >= MAX_BUSY_RETRY) {
      const err = new Error(json.error?.message || ("HTTP " + res.status));
      err.status = res.status; err.busy = busy; err.model = model;
      throw err;
    }
    const wait = 2 ** (attempt + 1);
    setStatus(`⏳ ${model} 서버가 바빠요. ${wait}초 뒤 다시 보낼게요 (${attempt + 1}/${MAX_BUSY_RETRY})`);
    if (attempt === 0 && announce) await speakOnce("서버가 바빠서 잠시 후 다시 시도합니다.");
    await sleep(wait * 1000);
    if (myRun !== runId) return null; // 그 사이 새로 시작했으면 중단
    setStatus(`${model}에게 다시 보내는 중... (사진 ${photos.length}장)`);
  }
}

async function sendToGemini() {
  const myRun = runId; // 안내 음성을 말하는 사이에 사용자가 새로 시작하면 이전 결과는 버림
  sending = true;
  setStatus(`Gemini에게 보내는 중... (사진 ${photos.length}장)`);
  const model = $("model").value.trim();
  const body = JSON.stringify({
    contents: [{ parts: [
      ...photos.map(d => ({ inline_data: { mime_type: "image/jpeg", data: d.split(",")[1] } })),
      { text: $("prompt").value + (photos.length > 1 ? MULTI_RULE(photos.length) : "") + SPEAK_RULE + RETAKE_RULE }
    ] }]
  });
  try {
    let json, usedModel = model;
    try {
      json = await askModel(model, body, myRun, true);
    } catch (e) {
      // 기본 모델이 계속 바쁘면 대체 모델로 다시 물어봄
      const fb = $("fallback").value.trim();
      if (!e.busy || !fb || fb === model || myRun !== runId) throw e;
      setStatus(`🔁 ${model} 서버가 계속 바빠요. 대체 모델(${fb})로 다시 물어볼게요`);
      await speakOnce("서버가 바빠서 다른 모델로 다시 물어보겠습니다.");
      if (myRun !== runId) return;
      usedModel = fb;
      try { json = await askModel(fb, body, myRun, false); }
      catch (e2) { e2.triedFallback = true; throw e2; }
    }
    if (!json) return; // 새로 시작돼서 중단
    const text = (json.candidates?.[0]?.content?.parts || [])
      .filter(p => p.text && !p.thought).map(p => p.text).join("\n").trim();
    if (!text) throw new Error("답변이 비어 있어요.");

    // 사진이 흐리거나 문제를 못 읽으면: 답을 읽지 않고 다시 찍게 함
    if (text.length < 30 && /RETAKE/i.test(text)) {
      retakeCount++;
      $("controls").classList.remove("hidden");
      if (retakeCount > MAX_AUTO_RETAKE) {
        capturing = false;
        setStatus("⚠️ 계속 흐리게 찍혀요. 밝은 곳에서 문제를 화면에 꽉 차게 맞춘 뒤 '새로 찍기'를 눌러주세요.");
        return;
      }
      setStatus(`⚠️ 사진이 흐리거나 문제가 안 읽혀요. 다시 찍을게요 (${retakeCount}/${MAX_AUTO_RETAKE})`);
      await speakOnce("재촬영하겠습니다.");
      await sleep(500);
      if (myRun === runId) startCamera(true);
      return;
    }
    retakeCount = 0;
    const sp = buildSpeech(text); // 코드 → 받아적기용 음성 (앱이 직접 변환)
    answerText = sp ? sp.display : text;
    answerLines = sp ? sp.lines : null;
    $("answer").textContent = answerText;
    $("answer").style.display = "block";
    $("controls").classList.remove("hidden");
    pausedLine = 0;
    $("earMsg").textContent = usedModel !== model ? `🔁 대체 모델(${usedModel})로 받은 답이에요` : "";
    await speakOnce("정답을 말씀드리겠습니다.");
    if (myRun === runId) { capturing = false; startLoop(); }
  } catch (e) {
    capturing = false;
    $("controls").classList.remove("hidden");
    // 원인별로 안내 (화면 + 음성)
    let msg, say;
    if (e.status === 429) {
      msg = "⚠️ 사용 한도를 넘었어요 (무료: 분당 5번·하루 20번). 1분쯤 뒤 다시 찍어보고, 계속 안 되면 오늘 한도를 다 쓴 거예요.";
      say = "사용 한도를 넘었습니다. 잠시 후 다시 찍어주세요.";
    } else if (e.busy && e.triedFallback) {
      msg = "⚠️ 기본 모델과 대체 모델 서버가 모두 바빠서 답을 못 받았어요. 잠시 후 다시 찍어주세요.";
      say = "두 모델 모두 서버가 바빠서 답을 받지 못했습니다. 잠시 후 다시 찍어주세요.";
    } else if (e.triedFallback && [400, 404].includes(e.status)) {
      msg = `⚠️ 대체 모델(${e.model})을 쓸 수 없어요. 설정의 대체 모델 이름을 확인해주세요. (${e.message})`;
      say = "대체 모델을 쓸 수 없습니다. 설정을 확인해주세요.";
    } else if (e.busy) {
      msg = "⚠️ Gemini 서버가 계속 바빠서 답을 못 받았어요. 잠시 후 다시 찍어주세요.";
      say = "서버가 바빠서 답을 받지 못했습니다. 잠시 후 다시 찍어주세요.";
    } else if ([400, 401, 403, 404].includes(e.status)) {
      msg = "오류: " + e.message + "  (API 키나 모델 이름을 확인해보세요)";
      say = "오류가 났습니다. 화면을 확인해주세요.";
    } else {
      msg = "오류: " + e.message;
      say = "오류가 났습니다. 화면을 확인해주세요.";
    }
    setStatus(msg);
    if (myRun === runId) speakOnce(say);
  } finally {
    sending = false;
  }
}

// ---------- 3. 답변을 음성으로 무한 반복 ----------
// ---------- 코드 → 받아적기용 음성 변환 (앱이 직접 만듦: 철자·대소문자·숫자·따옴표가 틀릴 수 없음) ----------
const LETTER = { A:"에이", B:"비", C:"씨", D:"디", E:"이", F:"에프", G:"지", H:"에이치", I:"아이", J:"제이", K:"케이", L:"엘", M:"엠",
  N:"엔", O:"오", P:"피", Q:"큐", R:"알", S:"에스", T:"티", U:"유", V:"브이", W:"더블유", X:"엑스", Y:"와이", Z:"제트" };
const DIGIT = ["영", "일", "이", "삼", "사", "오", "육", "칠", "팔", "구"];
// 한 글자 변수(N, L, M 등)는 소리가 비슷해서 힌트를 붙임: "대문자 엘" + (낮은 톤) "러브의 엘"
// 익숙한 영어 단어로, 엔·엠·엘처럼 헷갈리는 글자끼리는 첫소리가 확실히 다르게 고름
const HINT_WORD = { A:"애플", B:"바나나", C:"캣", D:"도그", E:"에그", F:"프렌드", G:"게임", H:"하우스", I:"아이스", J:"주스",
  K:"킹", L:"러브", M:"머니", N:"넘버", O:"오렌지", P:"피자", Q:"퀸", R:"로봇", S:"스타", T:"타이거",
  U:"엄브렐라", V:"비디오", W:"윈도우", X:"엑스레이", Y:"요요", Z:"지브라" };
const HINT_SKIP = new Set(["i", "j"]); // 반복문 i, j는 소리가 확실히 달라서 힌트 생략
const HINT_PITCH = 0.7;                // 힌트는 낮은 톤으로 (폰 음성에 따라 톤 변화가 없을 수 있음)
const SYMBOL = {
  "++": "플러스 플러스", "--": "마이너스 마이너스", "+=": "더하기 은", "-=": "빼기 은", "*=": "곱하기 은", "/=": "나누기 은",
  "%=": "나머지 은", "==": "같다", "!=": "다르다", "<=": "작거나 같다", ">=": "크거나 같다", "&&": "앤드", "||": "오어",
  "<<": "왼쪽 시프트", ">>": "오른쪽 시프트", "->": "화살표",
  ".": "점", ";": "세미콜론", ",": "쉼표", "=": "은", "(": "괄호 열고", ")": "괄호 닫고", "{": "중괄호 열고", "}": "중괄호 닫고",
  "[": "대괄호 열고", "]": "대괄호 닫고", "+": "더하기", "-": "빼기", "*": "곱하기", "/": "나누기", "%": "나머지",
  "<": "작다", ">": "크다", "!": "느낌표", "?": "물음표", ":": "콜론", "&": "앤드 기호", "|": "세로줄", "^": "캐럿",
  "~": "물결", "_": "언더바", "#": "샵", "@": "골뱅이", "\\": "역슬래시", "$": "달러", "'": "작은따옴표", '"': "큰따옴표"
};
// 글자 하나 읽기: 대문자는 "대문자 ○", 소문자는 그냥 ○, 숫자는 "숫자 ○"
function sayChar(ch) {
  if (/[A-Z]/.test(ch)) return "대문자 " + LETTER[ch];
  if (/[a-z]/.test(ch)) return LETTER[ch.toUpperCase()];
  if (/[0-9]/.test(ch)) return "숫자 " + DIGIT[ch];
  if (ch === " ") return "공백";
  return SYMBOL[ch] || ch;
}
const spell = w => [...w].map(sayChar).join(" ");
// 따옴표 안의 글자들 (이스케이프 \n 등은 '역슬래시 엔'으로)
const sayLiteral = body => [...body].map(sayChar).join(" ");
const TOKEN = /\s+|\/\/.*$|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|[A-Za-z_][A-Za-z0-9_]*|\d+(?:\.\d+)?|\+\+|--|\+=|-=|\*=|\/=|%=|==|!=|<=|>=|&&|\|\||<<|>>|->|./g;
// 코드 한 줄 → 읽을 조각 목록
function codeLineToChunks(line, pron) {
  const toks = (line.match(TOKEN) || []).filter(t => !/^\s+$/.test(t) && !t.startsWith("//"));
  const out = [];
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (t === "(" && toks[i + 1] === ")") { out.push("괄호 열고 닫고"); i++; continue; }
    if (/^[A-Za-z_]/.test(t)) {                 // 단어: 발음 한 번 + 철자
      if (t.length === 1 && /[A-Za-z]/.test(t)) {        // 한 글자 변수
        out.push(sayChar(t));
        const U = t.toUpperCase();
        if (!HINT_SKIP.has(t)) out.push({ t: `${HINT_WORD[U]}의 ${LETTER[U]}`, pitch: HINT_PITCH });
      } else {
        const sp = spell(t);
        // sc → "에스씨"처럼 발음이 철자 그대로면 한 번만 읽음
        if (pron[t] && pron[t].replace(/\s/g, "") !== sp.replace(/\s/g, "")) out.push(pron[t]);
        out.push(sp);
      }
    } else if (/^\d/.test(t)) {                 // 숫자: 한 자리씩 (예: 10 → 숫자 일 숫자 영)
      out.push([...t].map(c => c === "." ? "점" : "숫자 " + DIGIT[c]).join(" "));
    } else if (t[0] === '"' || t[0] === "'") {  // 따옴표: 작은따옴표/큰따옴표 구분
      const q = t[0] === '"' ? "큰따옴표" : "작은따옴표";
      const body = t.slice(1, -1);
      out.push(q); if (body) out.push(sayLiteral(body)); out.push(q);
    } else {
      out.push(SYMBOL[t] || t);
    }
  }
  return out;
}
// Gemini 응답(코드 블록 + "발음:" 줄) → 화면용 코드, 읽을 줄 목록
function buildSpeech(text) {
  const pron = {};
  const pm = text.match(/발음\s*:\s*(.+)/);
  if (pm) for (const m of pm[1].matchAll(/([A-Za-z_][A-Za-z0-9_]*)\s*=\s*([^,，\n]+)/g)) pron[m[1]] = m[2].trim();
  const fence = text.match(/```[a-zA-Z]*\s*\n?([\s\S]*?)```/);
  let code = fence ? fence[1] : text.replace(/발음\s*:.*$/m, "");
  if (!fence && !/[;{}]/.test(code)) return null; // 코드가 아니면(예전 형식) null
  const codeLines = code.split("\n").map(l => l.replace(/\s+$/, "")).filter(l => l.trim());
  const lines = codeLines.map(l => codeLineToChunks(l, pron)).filter(c => c.length);
  return { display: codeLines.join("\n"), lines };
}

// 코드 한 줄 = 한 번에 읽는 단위 (줄바꿈으로만 나눔)
// 한 줄은 다시 슬래시(/)로 말마디 조각을 나눔
function splitLines(t) {
  return t.split(/\n+/)
    .map(l => l.replace(/[*#`>|~]/g, " ").split("/").map(c => c.replace(/\s+/g, " ").trim()).filter(Boolean))
    .filter(chunks => chunks.length);
}
// 멈춤 버튼을 누르면 쉬는 도중에도 바로 끝나는 대기
async function waitWhileLooping(ms, on = () => looping) {
  const end = Date.now() + ms;
  while (on() && Date.now() < end) await sleep(Math.min(200, end - Date.now()));
}
let loopGen = 0; // 읽기 회차 번호: 새로 읽기를 시작하면 이전 회차는 즉시 끝나게 함
function koreanVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => v.lang && v.lang.replace("_", "-").startsWith("ko"));
}
function speakOnce(sentence, pitch) {
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(sentence);
    u.lang = "ko-KR";
    const v = koreanVoice(); if (v) u.voice = v;
    u.rate = Number($("rate").value) || 1;
    u.pitch = pitch || 1;
    u.onend = resolve; u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}
async function startLoop(startLine = 0) {
  stopSpeaking();
  const g = ++loopGen;
  const on = () => looping && g === loopGen; // 이 회차가 아직 유효한지
  await sleep(100);
  if (g !== loopGen) return;
  looping = true;
  const lines = answerLines || splitLines(answerText);
  const chunkGap = Math.max(0, Number($("chunkgap").value)) * 1000;
  const lineGap = Math.max(0, Number($("linegap").value)) * 1000;
  let round = 0;
  while (on()) {
    round++;
    const from = (round === 1 && startLine < lines.length) ? startLine : 0;
    for (let i = from; i < lines.length && on(); i++) {
      curLine = i;
      setStatus(`🔊 재생 중 (${round}번째 · ${i + 1}/${lines.length}줄)`);
      const chunks = lines[i];
      for (let k = 0; k < chunks.length && on(); k++) {
        await speakOnce(chunks[k].t ?? chunks[k], chunks[k].pitch); // 힌트 조각은 낮은 톤
        if (k < chunks.length - 1) await waitWhileLooping(chunkGap, on);
      }
      if (!on()) break; // 멈춤 직후 상태 문구를 덮어쓰지 않게
      if (i < lines.length - 1) {
        if (lineGap > 0) setStatus(`⏸ 다음 줄까지 쉬는 중 (${i + 1}/${lines.length}줄 끝)`);
        await waitWhileLooping(lineGap, on);
      }
    }
    if (!on()) break;
    // 마지막 줄도 받아적을 시간을 준 뒤, 끝났다고 알리고 다시 시작
    await waitWhileLooping(lineGap, on);
    if (!on()) break;
    setStatus(`✅ 끝났어요 (${round}번째). 곧 처음부터 다시 읽어요`);
    await speakOnce("끝났습니다. 잠시 후 처음부터 다시 읽겠습니다.");
    await waitWhileLooping((Number($("gap").value) || 0) * 1000, on);
  }
}
function stopSpeaking() {
  looping = false;
  speechSynthesis.cancel();
}

// 직접 누르면 자동 재촬영 횟수를 처음부터 다시 셈
$("startBtn").onclick = () => { retakeCount = 0; startCamera(); };
$("againBtn").onclick = () => { retakeCount = 0; startCamera(); };
$("nextBtn").onclick = () => { $("shotControls").classList.add("hidden"); $("fileInput").value = ""; $("fileInput").click(); };
// 사진·Gemini 없이 샘플 답으로 음성/쉬는 시간만 확인 (API 한도 소모 없음)
const SAMPLE_ANSWER = [
  "```java",
  "int N = sc.nextInt();",
  "int L = sc.nextInt();",
  "for (int j = L; j >= calorie[i]; j--) {",
  "sum += line.charAt(j) - '0';",
  "System.out.println(\"#\" + test_case + \" \" + dp[L]);",
  "```",
  "발음: int=인트, sc=에스씨, nextInt=넥스트인트, for=포, calorie=칼로리, sum=섬, line=라인, charAt=차앳, System=시스템, out=아웃, println=프린트엘엔, test_case=테스트케이스, dp=디피"
].join("\n");
$("testBtn").onclick = () => {
  document.body.classList.remove("initial");
  capturing = false; pausedLine = 0;
  ensureEarbud();
  photos = []; renderPhotos(); $("shotControls").classList.add("hidden");
  retakeCount = 0;
  stopCamera();
  speechSynthesis.cancel();
  const sp = buildSpeech(SAMPLE_ANSWER);
  answerText = sp.display; answerLines = sp.lines;
  $("answer").textContent = answerText;
  $("answer").style.display = "block";
  $("controls").classList.remove("hidden");
  const my = ++runId;
  speakOnce("정답을 말씀드리겠습니다.").then(() => { if (my === runId) startLoop(); });
};
$("playBtn").onclick = () => { if (answerText) startLoop(); };
$("stopBtn").onclick = () => { if (looping) pausedLine = curLine; runId++; stopSpeaking(); setStatus("⏹ 멈춤"); }; // runId++ : 안내 음성 도중 멈춰도 읽기가 시작되지 않게
speechSynthesis.onvoiceschanged = () => {};

// ---------- 4. 🎧 블루투스 이어폰 조작 (Media Session) ----------
// 이어폰 탭은 '재생/일시정지·이전 곡·다음 곡' 신호로만 들어옴 (몇 번 탭했는지는 알 수 없음).
// 신호를 받으려면 페이지가 '재생 중'이어야 해서, 소리 없는 오디오를 계속 틀어둠.
let keepAlive = null;
function silentWavUrl(sec) {
  const rate = 8000, n = rate * sec, buf = new ArrayBuffer(44 + n), d = new DataView(buf);
  const w = (o, t) => { for (let i = 0; i < t.length; i++) d.setUint8(o + i, t.charCodeAt(i)); };
  w(0, "RIFF"); d.setUint32(4, 36 + n, true); w(8, "WAVE"); w(12, "fmt ");
  d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true);
  d.setUint32(24, rate, true); d.setUint32(28, rate, true); d.setUint16(32, 1, true); d.setUint16(34, 8, true);
  w(36, "data"); d.setUint32(40, n, true);
  for (let i = 0; i < n; i++) d.setUint8(44 + i, 128); // 8비트 무음
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}
const earOn = () => $("earOn").checked;
function ensureEarbud() {
  if (!earOn() || !("mediaSession" in navigator)) return;
  if (!keepAlive) {
    keepAlive = new Audio(silentWavUrl(10)); // 너무 짧은 소리는 미디어로 인식 안 될 수 있어서 10초 반복
    keepAlive.loop = true;
    // 음성 읽기 등으로 멈추면 다시 틀어서 이어폰 신호를 계속 받음
    keepAlive.addEventListener("pause", () => { if (earOn()) setTimeout(() => keepAlive.play().catch(() => {}), 300); });
    navigator.mediaSession.metadata = new MediaMetadata({ title: "찍고 듣기", artist: "1탭 멈춤/재생 · 2탭 처음부터 · 3탭 새로 찍기" });
    const on = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
    on("play", () => earAction("재생/일시정지", toggleReading));
    on("pause", () => earAction("재생/일시정지", toggleReading));
    on("previoustrack", () => earAction("이전 곡", replayFromStart));
    on("nexttrack", () => earAction("다음 곡", () => { retakeCount = 0; startCamera(); }));
  }
  keepAlive.play().catch(() => {});
  navigator.mediaSession.playbackState = "playing";
}
function earAction(name, fn) {
  if (!earOn()) return;
  $("earMsg").textContent = `🎧 이어폰 신호: ${name} (${new Date().toLocaleTimeString()})`;
  fn();
}
function toggleReading() {
  if (capturing) return; // 찍는 중·답 기다리는 중에는 무시
  if (looping) {
    pausedLine = curLine; runId++; stopSpeaking();
    setStatus(`⏸ 멈춤 (${pausedLine + 1}번째 줄). 한 번 탭하면 이어서 읽어요`);
  } else if (answerText) {
    startLoop(pausedLine);
  }
}
function replayFromStart() {
  if (capturing || !answerText) return;
  const my = ++runId; stopSpeaking(); pausedLine = 0;
  speakOnce("처음부터 다시 읽겠습니다.").then(() => { if (my === runId) startLoop(0); });
}
try { const v = localStorage.getItem("gcv_earOn"); if (v !== null) $("earOn").checked = v === "1"; } catch (e) {}
$("earOn").addEventListener("change", () => {
  try { localStorage.setItem("gcv_earOn", earOn() ? "1" : "0"); } catch (e) {}
  if (earOn()) ensureEarbud();
  else if (keepAlive) { keepAlive.pause(); navigator.mediaSession.playbackState = "none"; }
});
</script>
