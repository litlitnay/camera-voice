<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찍고 듣기 - Gemini 카메라 음성</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         background: #111; color: #eee; padding: 16px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  label { display: block; font-size: 13px; color: #aaa; margin: 10px 0 4px; }
  input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333;
                    background: #1c1c1c; color: #eee; font-size: 15px; }
  textarea { min-height: 60px; resize: vertical; }
  details { background: #1a1a1a; border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
  summary { cursor: pointer; font-weight: 600; }
  button { width: 100%; padding: 16px; font-size: 18px; font-weight: 700; border: 0;
           border-radius: 12px; margin-top: 10px; cursor: pointer; }
  .main { background: #4f8cff; color: #fff; }
  .sub  { background: #2a2a2a; color: #eee; font-size: 16px; padding: 12px; }
  .stop { background: #ff5a5a; color: #fff; }
  .row { display: flex; gap: 8px; } .row button { flex: 1; }
  #stage { position: relative; margin-top: 14px; border-radius: 12px; overflow: hidden;
           background: #000; aspect-ratio: 3/4; display: none; }
  #stage video, #stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           font-size: 96px; font-weight: 800; color: #fff; text-shadow: 0 0 20px #000; }
  #status { margin-top: 12px; font-size: 15px; color: #9ec1ff; min-height: 20px; }
  #answer { margin-top: 10px; background: #1a1a1a; border-radius: 10px; padding: 14px;
            line-height: 1.6; white-space: pre-wrap; display: none; }
  .hidden { display: none !important; }
  /* 처음 화면: 시작 버튼이 남은 화면을 가득 채움 */
  body.initial { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  body.initial details { flex: none; }
  body.initial #startBtn { flex: 1; min-height: 55vh; min-height: 55dvh; font-size: 36px; line-height: 1.4; }
  body.initial #testBtn { flex: none; }
</style>
</head>
<body class="initial">
<h1>📷 찍고 → 🤖 Gemini → 🔊 계속 듣기</h1>

<details id="settings">
  <summary>설정 (처음 한 번만)</summary>
  <label>Gemini API 키 (aistudio.google.com 에서 발급)</label>
  <input id="key" type="password" placeholder="AIza..." autocomplete="off">
  <label>모델 이름</label>
  <input id="model" value="gemini-3.6-flash">
  <label>Gemini에게 보낼 질문</label>
  <textarea id="prompt">지금부터 코딩 문제를 보여주면 다른 설명 아무것도 없이, 답만 출력해. 언어는 java이고, 답은 for (int test_case =1; test_case <= T; test_case++) {이 안에 들어갈 답만 출력해}.</textarea>
  <label>읽는 속도 (0.5 ~ 2)</label>
  <input id="rate" type="number" step="0.05" min="0.5" max="2" value="0.8">
  <label>반복 사이 쉬는 시간 (초)</label>
  <input id="gap" type="number" step="0.5" min="0" value="10">
  <label>한 줄 안에서 말마디 사이 쉬는 시간 (초)</label>
  <input id="chunkgap" type="number" step="0.5" min="0" value="0.5">
  <label>코드 한 줄 읽고 쉬는 시간 (초)</label>
  <input id="linegap" type="number" step="1" min="0" value="5">
  <label>찍기 전 카운트다운 (초)</label>
  <input id="countdown" type="number" min="0" max="10" value="5">
  <label>카메라 줌 (배, 1 = 줌 없음)</label>
  <input id="zoom" type="number" step="0.1" min="1" max="5" value="1.5">
</details>

<button id="startBtn" class="main">📷<br>시작<br><span style="font-size:15px;font-weight:400">카메라 켜고 자동으로 찍기</span></button>
<button id="testBtn" class="sub">🔊 음성만 테스트 (사진·API 안 씀)</button>
<input id="fileInput" type="file" accept="image/*" capture="environment" class="hidden">

<div id="stage">
  <video id="video" playsinline muted></video>
  <img id="photo" alt="찍은 사진" class="hidden">
  <div id="count"></div>
</div>

<div id="status"></div>
<div id="answer"></div>

<div id="controls" class="hidden">
  <button id="stopBtn" class="stop">⏹ 음성 멈추기</button>
  <div class="row">
    <button id="playBtn" class="sub">▶ 다시 재생</button>
    <button id="againBtn" class="sub">📷 새로 찍기</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fields = ["key", "model", "prompt", "rate", "gap", "linegap", "chunkgap", "countdown", "zoom"];

// 설정 저장/불러오기 (이 폰 브라우저에만 저장됨)
fields.forEach(f => {
  try { const v = localStorage.getItem("gcv_" + f); if (v !== null) $(f).value = v; } catch (e) {}
  $(f).addEventListener("change", () => { try { localStorage.setItem("gcv_" + f, $(f).value); } catch (e) {} });
});
if (!$("key").value) $("settings").open = true;

let stream = null, looping = false, answerText = "", wakeLock = null;
let retakeCount = 0, digitalZoom = 1;
const MAX_AUTO_RETAKE = 3;
// 저장된 예전 프롬프트를 써도 같은 답이 두 번 읽히지 않도록 코드에서 한 번 더 못박음
const SPEAK_RULE = `

[출력 형식 - 위 지시와 충돌하면 이 규칙이 우선]
- 코드 원본은 절대 출력하지 말고, 소리 내어 읽을 한글 텍스트 한 가지 버전만 출력해. 같은 내용을 두 번 쓰지 마.
- 코드 한 줄을 출력 한 줄로 바꿔. 줄바꿈으로만 줄을 나누고, 빈 줄·번호·마크다운·마침표는 쓰지 마.
- 모든 글자와 기호를 한국어 소리로 풀어 써. 영어·숫자·기호를 그대로 쓰지 마.
- 변수 이름이 한두 글자거나 약어면 알파벳 이름 그대로 읽어: N→엔, T→티, i→아이, sc→에스씨, sb→에스비. 숫자는 한국어로 읽어.
- 자바 예약어와 아주 기본적인 이름(int, for, if, else, while, return, new, class, public, static, void, String, Scanner, System, out, print, println, Math, nextInt, nextLine, length, size)은 영어 발음 그대로 한글로 붙여 써: int→인트, String→스트링, nextInt→넥스트인트.
- 그 밖의 모든 변수 이름, 메서드 이름, 생소한 문법은 먼저 영어 발음을 한 조각으로 쓰고, 바로 다음 조각에 알파벳을 한 글자씩 풀어 써. 대문자는 글자 앞에 "대문자"를 붙여. 예: append → 어펜드 / 에이 피 피 이 엔 디, maxValue → 맥스밸류 / 엠 에이 엑스 대문자브이 에이 엘 유 이.
- 알파벳 읽기: A 에이, B 비, C 씨, D 디, E 이, F 에프, G 지, H 에이치, I 아이, J 제이, K 케이, L 엘, M 엠, N 엔, O 오, P 피, Q 큐, R 알, S 에스, T 티, U 유, V 브이, W 더블유, X 엑스, Y 와이, Z 제트.
- 기호는 이렇게 읽어: . 점 / ; 세미콜론 / , 쉼표 / = 은 / ( 괄호 열고 / ) 닫고 / { 중괄호 열고 / } 중괄호 닫고 / [ 대괄호 열고 / ] 대괄호 닫고 / + 더하기 / - 빼기 / * 곱하기 / / 나누기 / % 나머지 / < 작다 / > 크다 / <= 작거나 같다 / >= 크거나 같다 / == 같다 / != 다르다 / && 앤드 / || 오어 / _ 언더바 / " 따옴표.
- 괄호 안에 아무것도 없으면 "괄호 열고 닫고"라고만 읽어.
- 받아적을 수 있게, 한 줄 안에서도 한두 단어(또는 기호)씩 슬래시( / )로 끊어 써. 슬래시는 읽는 단위를 나누는 표시일 뿐이야.
- 예: int N = sc.nextInt(); → 인트 / 엔 / 은 / 에스씨 / 점 / 넥스트인트 / 괄호 열고 닫고 / 세미콜론`;
const RETAKE_RULE = "\n\n[추가 규칙] 사진이 흐리거나, 잘렸거나, 너무 어둡거나, 문제 글자를 정확히 읽을 수 없으면 다른 말은 절대 하지 말고 정확히 RETAKE 라는 단어 하나만 출력해.";
const setStatus = t => $("status").textContent = t;
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- 1. 카메라 켜고 자동 촬영 ----------
async function startCamera() {
  stopSpeaking();
  $("answer").style.display = "none";
  $("controls").classList.add("hidden");
  if (!$("key").value.trim()) { $("settings").open = true; setStatus("먼저 설정에서 API 키를 넣어주세요."); return; }

  document.body.classList.remove("initial"); // 시작하면 버튼을 일반 크기로
  // 음성 기능 잠금 해제 (폰은 버튼을 누른 순간에만 소리를 허락함)
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(" "));
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {}

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }, audio: false
    });
  } catch (e) {
    // 자동 카메라가 안 되면 폰 기본 카메라 앱으로 대신 찍기
    setStatus("자동 카메라를 쓸 수 없어서 기본 카메라를 엽니다. 사진을 찍어주세요.");
    $("fileInput").value = "";
    $("fileInput").click();
    return;
  }

  $("stage").style.display = "block";
  $("photo").classList.add("hidden");
  const v = $("video");
  v.classList.remove("hidden");
  v.srcObject = stream;
  await v.play();
  await applyZoom();
  await sleep(700); // 초점·밝기 맞출 시간

  for (let i = Number($("countdown").value) || 0; i > 0; i--) {
    $("count").textContent = i; setStatus("곧 찍어요...");
    await sleep(1000);
  }
  $("count").textContent = "";

  // 디지털 줌이 필요하면 가운데 부분만 잘라서 사용
  const sw = v.videoWidth / digitalZoom, sh = v.videoHeight / digitalZoom;
  const sx = (v.videoWidth - sw) / 2, sy = (v.videoHeight - sh) / 2;
  const c = document.createElement("canvas");
  const scale = Math.min(1, 1280 / Math.max(sw, sh));
  c.width = sw * scale; c.height = sh * scale;
  c.getContext("2d").drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const dataUrl = c.toDataURL("image/jpeg", 0.85);
  stopCamera();
  showPhoto(dataUrl);
  await sendToGemini(dataUrl);
}

// 줌: 카메라 자체 줌을 먼저 쓰고, 안 되면 디지털 줌(중앙 확대)으로 대신함
async function applyZoom() {
  const want = Math.max(1, Number($("zoom").value) || 1);
  digitalZoom = want;
  try {
    const track = stream.getVideoTracks()[0];
    const cap = track.getCapabilities && track.getCapabilities();
    if (cap && cap.zoom) {
      const target = Math.min(Math.max(want, cap.zoom.min), cap.zoom.max);
      await track.applyConstraints({ advanced: [{ zoom: target }] });
      digitalZoom = Math.max(1, want / target);
    }
  } catch (e) { digitalZoom = want; }
  $("video").style.transform = `scale(${digitalZoom})`;
}

function stopCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $("video").classList.add("hidden");
}

function showPhoto(dataUrl) {
  $("stage").style.display = "block";
  $("photo").src = dataUrl;
  $("photo").classList.remove("hidden");
}

// 기본 카메라 앱으로 찍었을 때
$("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = async () => {
    const c = document.createElement("canvas");
    const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
    c.width = img.width * scale; c.height = img.height * scale;
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL("image/jpeg", 0.85);
    showPhoto(dataUrl);
    await sendToGemini(dataUrl);
  };
  img.src = URL.createObjectURL(file);
});

// ---------- 2. Gemini에 자동 전송 ----------
async function sendToGemini(dataUrl) {
  setStatus("Gemini에게 보내는 중...");
  const base64 = dataUrl.split(",")[1];
  const model = $("model").value.trim();
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": $("key").value.trim() },
      body: JSON.stringify({
        contents: [{ parts: [
          { inline_data: { mime_type: "image/jpeg", data: base64 } },
          { text: $("prompt").value + SPEAK_RULE + RETAKE_RULE }
        ] }]
      })
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error?.message || ("HTTP " + res.status));
    const text = (json.candidates?.[0]?.content?.parts || [])
      .filter(p => p.text && !p.thought).map(p => p.text).join("\n").trim();
    if (!text) throw new Error("답변이 비어 있어요.");

    // 사진이 흐리거나 문제를 못 읽으면: 답을 읽지 않고 다시 찍게 함
    if (text.length < 30 && /RETAKE/i.test(text)) {
      retakeCount++;
      $("controls").classList.remove("hidden");
      if (retakeCount > MAX_AUTO_RETAKE) {
        setStatus("⚠️ 계속 흐리게 찍혀요. 밝은 곳에서 문제를 화면에 꽉 차게 맞춘 뒤 '새로 찍기'를 눌러주세요.");
        return;
      }
      setStatus(`⚠️ 사진이 흐리거나 문제가 안 읽혀요. 다시 찍을게요 (${retakeCount}/${MAX_AUTO_RETAKE})`);
      await speakOnce("사진이 흐려요. 다시 찍을게요.");
      await sleep(500);
      startCamera();
      return;
    }
    retakeCount = 0;
    answerText = text;
    $("answer").textContent = text;
    $("answer").style.display = "block";
    $("controls").classList.remove("hidden");
    startLoop();
  } catch (e) {
    setStatus("오류: " + e.message + "  (API 키나 모델 이름을 확인해보세요)");
    $("controls").classList.remove("hidden");
  }
}

// ---------- 3. 답변을 음성으로 무한 반복 ----------
// 코드 한 줄 = 한 번에 읽는 단위 (줄바꿈으로만 나눔)
// 한 줄은 다시 슬래시(/)로 말마디 조각을 나눔
function splitLines(t) {
  return t.split(/\n+/)
    .map(l => l.replace(/[*#`>|~]/g, " ").split("/").map(c => c.replace(/\s+/g, " ").trim()).filter(Boolean))
    .filter(chunks => chunks.length);
}
// 멈춤 버튼을 누르면 쉬는 도중에도 바로 끝나는 대기
async function waitWhileLooping(ms) {
  const end = Date.now() + ms;
  while (looping && Date.now() < end) await sleep(Math.min(200, end - Date.now()));
}
function koreanVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => v.lang && v.lang.replace("_", "-").startsWith("ko"));
}
function speakOnce(sentence) {
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(sentence);
    u.lang = "ko-KR";
    const v = koreanVoice(); if (v) u.voice = v;
    u.rate = Number($("rate").value) || 1;
    u.onend = resolve; u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}
async function startLoop() {
  stopSpeaking();
  await sleep(100);
  looping = true;
  const lines = splitLines(answerText);
  const chunkGap = Math.max(0, Number($("chunkgap").value)) * 1000;
  const lineGap = Math.max(0, Number($("linegap").value)) * 1000;
  let round = 0;
  while (looping) {
    round++;
    for (let i = 0; i < lines.length && looping; i++) {
      setStatus(`🔊 재생 중 (${round}번째 · ${i + 1}/${lines.length}줄)`);
      const chunks = lines[i];
      for (let k = 0; k < chunks.length && looping; k++) {
        await speakOnce(chunks[k]);
        if (k < chunks.length - 1) await waitWhileLooping(chunkGap);
      }
      if (i < lines.length - 1) {
        if (lineGap > 0) setStatus(`⏸ 다음 줄까지 쉬는 중 (${i + 1}/${lines.length}줄 끝)`);
        await waitWhileLooping(lineGap);
      }
    }
    if (!looping) break;
    // 마지막 줄도 받아적을 시간을 준 뒤, 끝났다고 알리고 다시 시작
    await waitWhileLooping(lineGap);
    if (!looping) break;
    setStatus(`✅ 끝났어요 (${round}번째). 곧 처음부터 다시 읽어요`);
    await speakOnce("끝났습니다. 잠시 후 처음부터 다시 읽겠습니다.");
    await waitWhileLooping((Number($("gap").value) || 0) * 1000);
  }
}
function stopSpeaking() {
  looping = false;
  speechSynthesis.cancel();
}

// 직접 누르면 자동 재촬영 횟수를 처음부터 다시 셈
$("startBtn").onclick = () => { retakeCount = 0; startCamera(); };
$("againBtn").onclick = () => { retakeCount = 0; startCamera(); };
// 사진·Gemini 없이 샘플 답으로 음성/쉬는 시간만 확인 (API 한도 소모 없음)
const SAMPLE_ANSWER = [
  "인트 / 엔 / 은 / 에스씨 / 점 / 넥스트인트 / 괄호 열고 닫고 / 세미콜론",
  "포 / 괄호 열고 / 인트 / 아이 / 은 / 영 / 세미콜론 / 아이 / 작다 / 엔 / 세미콜론 / 아이 / 플러스 플러스 / 닫고",
  "에스 / 점 / 어펜드 / 괄호 열고 / 아이 / 닫고 / 세미콜론"
].join("\n");
$("testBtn").onclick = () => {
  document.body.classList.remove("initial");
  retakeCount = 0;
  stopCamera();
  speechSynthesis.cancel();
  answerText = SAMPLE_ANSWER;
  $("answer").textContent = SAMPLE_ANSWER;
  $("answer").style.display = "block";
  $("controls").classList.remove("hidden");
  startLoop();
};
$("playBtn").onclick = () => { if (answerText) startLoop(); };
$("stopBtn").onclick = () => { stopSpeaking(); setStatus("⏹ 멈춤"); };
speechSynthesis.onvoiceschanged = () => {};
</script>
</body>
</html>
